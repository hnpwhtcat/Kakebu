<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f2;--card:#fff;--ink:#1d2731;--mute:#66727e;--line:#dde1dd;--ai:#23466b;--aif:#fff;--ok:#4b7a4f;--bad:#b23b2b;--soft:#e9eef3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181e;--card:#1b232b;--ink:#e8edf1;--mute:#93a0ac;--line:#2b3641;--ai:#7fa8d4;--aif:#0f1a25;--ok:#8fc194;--bad:#e5806f;--soft:#242f3a}}
:root[data-theme="dark"]{--bg:#12181e;--card:#1b232b;--ink:#e8edf1;--mute:#93a0ac;--line:#2b3641;--ai:#7fa8d4;--aif:#0f1a25;--ok:#8fc194;--bad:#e5806f;--soft:#242f3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans KR','Noto Sans JP',system-ui,sans-serif;padding-bottom:76px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
header{flex-wrap:wrap}header h1{font-size:18px;margin:0;flex:1}header button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}header button.off{opacity:.45}
header input{width:auto}
main{max-width:640px;margin:0 auto;padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px}h2 small{font-weight:400;color:var(--mute);margin-left:6px}
label{display:block;font-size:12px;color:var(--mute)}
input,select{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:3px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ai);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.w2{grid-column:span 2}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button.pri{background:var(--ai);color:var(--aif);border-color:var(--ai);font-weight:700;width:100%;padding:11px}
header button{background:var(--ai);color:var(--aif);border-color:var(--ai);font-weight:700;white-space:nowrap}
button.x{border:0;background:none;color:var(--mute);padding:4px 8px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 5px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:500}
.sc{overflow-x:auto}
.up{color:var(--bad)}.dn{color:var(--ok)}
.hero .lab{color:var(--mute);font-size:13px}.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.row3 div{background:var(--soft);border-radius:8px;padding:8px;font-weight:500;font-size:14px}.row3 span{display:block;font-size:11px;color:var(--mute);font-weight:400}
.br{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}.br i{display:block;height:12px;background:var(--ai);border-radius:3px;min-width:2px}
.it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.it .m{flex:1;min-width:0}.it .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it .m span{font-size:12px;color:var(--mute)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mute)}
.bd{margin-bottom:14px}.bh{display:flex;justify-content:space-between;align-items:center;gap:10px}.bh input{width:110px;text-align:right}
.bar{height:8px;background:var(--soft);border-radius:4px;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}.bar i.warn{background:#c98a1b}.bar i.over{background:var(--bad)}
.bs{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.fr{display:grid;grid-template-columns:1fr 96px auto auto;gap:6px;align-items:center;margin-bottom:6px}.fr input{margin:0}.fr input[type=checkbox]{width:20px;height:20px}
.empty{color:var(--mute);padding:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mute);font-size:13px}nav button.on{color:var(--ai);font-weight:700;box-shadow:inset 0 3px 0 var(--ai)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:9}

/* layout fixes: keep inputs inside their cards on iPhone */
input,select{font-size:16px;min-height:42px}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;text-align:left;min-width:0;max-width:100%}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
select{-webkit-appearance:none;appearance:none;padding-right:30px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238a96a3' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 11px center}
.grid>*,.fr>*{min-width:0}
input[type=checkbox]{min-height:0;padding:0}
header{flex-wrap:nowrap;gap:6px;padding:8px 12px}
header h1{display:none;flex:none}
@media(min-width:520px){header h1{display:block}}
header input{width:auto;flex:1 1 0;min-width:0;margin:0;min-height:38px;font-size:15px}
header button{font-size:13px;padding:8px 10px;flex:none}
@media(max-width:360px){header button{padding:8px 7px;font-size:12px}}

/* refined look */
:root{--bg:#f4f5f8;--line:#e7e9f0;--ink:#141a26;--mute:#6b7485;--ai:#2f4b8f;--soft:#eef1f7}
body{letter-spacing:-.01em;font-variant-numeric:tabular-nums}
header{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:0}
.card{border:0;border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(20,26,38,.05),0 8px 24px rgba(20,26,38,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{box-shadow:none;border:1px solid var(--line)}}
h2{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:12px}h2 small{font-size:12px;opacity:.85}
input,select{border-radius:12px;border-color:transparent;background:var(--soft)}
input:focus,select:focus{background:var(--card);border-color:var(--ai);box-shadow:0 0 0 3px color-mix(in srgb,var(--ai) 18%,transparent);outline:0}
button.pri{border-radius:14px;padding:13px;box-shadow:0 6px 16px color-mix(in srgb,var(--ai) 30%,transparent)}
header button{border-radius:10px}
.hero{background:linear-gradient(145deg,#1f3466,#3a57a7);color:#fff}
.hero .lab{color:rgba(255,255,255,.7)}.big{font-size:40px;letter-spacing:-1.2px;margin:2px 0 4px}
.hero .up{color:#ffb9ad}.hero .dn{color:#aee6b4}
.row3 div{background:rgba(255,255,255,.14);color:#fff;border-radius:12px}.row3 span{color:rgba(255,255,255,.7)}
.tag{border:0;background:var(--soft);border-radius:6px;padding:1px 7px}
.bar{height:10px;border-radius:5px}.bar i{border-radius:5px;background:linear-gradient(90deg,#5b8f60,#86b98b)}.bar i.warn{background:#d19a2e}.bar i.over{background:var(--bad)}
.br i{height:14px;border-radius:7px;background:linear-gradient(90deg,#2f4b8f,#5f7fcf)}
th{font-size:12px;font-weight:600}tr:last-child td{border-bottom:0}
nav{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav button{position:relative;font-weight:500}nav button.on{box-shadow:none}nav button.on::after{content:"";position:absolute;top:0;left:34%;right:34%;height:3px;border-radius:0 0 3px 3px;background:var(--ai)}
#toast{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.fi{margin-bottom:8px}.fi .fr{margin-bottom:2px}.hs{font-size:12px;color:var(--mute);margin:0 2px 8px}.hint{font-size:12px;color:var(--mute);margin:8px 0 14px}
label.fbtn{display:block;text-align:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}</style></head><body>
<header><h1>가계부</h1><input type="month" id="vm" aria-label="조회 월"><button id="ub" class="ghost" onclick="undo()">↩ 되돌리기</button><button onclick="exportX()">엑셀 내보내기</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY='kakeibo-app-v1',pad=n=>String(n).padStart(2,'0');
const ld=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=ld(new Date()),mk=d=>d.slice(0,7);
const addM=(ym,n)=>{const[y,m]=ym.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP'),pct=n=>(n>0?'+':'')+(n*100).toFixed(1)+'%';
const sg=n=>(n>0?'+':n<0?'−':'')+yen(Math.abs(n)),d2=n=>n>0?'up':n<0?'dn':'';
const seed=()=>({entries:[{id:1,date:'2026-09-27',cat:'買い物',shop:'フェルナ',amt:4925,note:''}],utils:[],
fixed:[['住宅ローン',0,1],['光回線',0,1],['通信費(俺)',0,1],['通信費(ゆうき)',0,1],['NISA(俺)',85000,1],['SONY投資(ゆうき)',20000,1],['がん保険(俺)',0,1],['医療保険？(俺)',0,1],['がん保険(ゆうき)',0,1],['保険',0,1],['Apple Music',1980,0],['iCloud',540,1],['Netflix',890,1],['Apple Care',1730,1],['宝くじ',2800,1]].map(([n,a,u])=>({n,a,u})),
reg:['買い物','外食','デート費','ガソリン代','医療費'],irr:['車整備','税金','飛行機代','家電','御祝儀'],
budget:{'買い物':30000,'外食':10000,'デート費':5000,'ガソリン代':8500,'医療費':5000},vm:mk(today)});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=seed();
function mig(){S.fixed.forEach(f=>{if(!f.h){f.h=[['0000-01',+f.a||0]];delete f.a}})}mig();
let H=[];try{H=JSON.parse(localStorage.getItem(KEY+'-h'))||[]}catch(e){}
let tab='in';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'-h',JSON.stringify(H))}catch(e){}};
function snap(){H.push(JSON.stringify(S));if(H.length>30)H.shift()}
function updUndo(){const b=$('#ub');if(b){b.classList.toggle('off',!H.length);b.setAttribute('aria-disabled',String(!H.length));b.title=H.length?'직전 작업을 취소 ('+H.length+'단계)':'되돌릴 작업이 없어요'}}
function undo(){if(!H.length)return flash('되돌릴 작업이 없어요');S=JSON.parse(H.pop());mig();save();render();flash('직전 작업을 되돌렸어요')}
function flash(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2200)}
/* calc */
const amtAt=(f,ym)=>{let a=0;for(const[m,v]of f.h)if(m<=ym)a=v;return a};
const fixedBase=(ym=S.vm)=>S.fixed.filter(f=>f.u).reduce((s,f)=>s+amtAt(f,ym),0);
const uM=ym=>S.utils.filter(u=>u.ym===ym).reduce((s,u)=>s+u.e+u.g+u.w,0);
const entM=(ym,f=()=>true)=>S.entries.filter(e=>mk(e.date)===ym&&f(e)).reduce((s,e)=>s+e.amt,0);
const tot=ym=>{const fx=fixedBase(ym)+uM(ym),rg=entM(ym,e=>S.reg.includes(e.cat)),ir=entM(ym,e=>!S.reg.includes(e.cat));return{fx,rg,ir,all:fx+rg+ir}};
/* views */
function vIn(){
 const o=c=>`<option>${esc(c)}</option>`,list=S.entries.filter(e=>mk(e.date)===S.vm).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id),sum=list.reduce((s,e)=>s+e.amt,0);
 return `<section class="card"><h2>지출 입력<small>날짜는 직전 입력이 유지돼요</small></h2><div class="grid">
 <label>날짜<input id="fd" type="date" value="${S.ld||today}"></label>
 <label>큰항목<select id="fc">${S.reg.map(o).join('')}<optgroup label="비정기">${S.irr.map(o).join('')}</optgroup></select></label>
 <label class="w2">가게/내용<input id="fs"></label><label>금액(엔)<input id="fa" type="number" inputmode="numeric"></label><label>비고<input id="fn"></label></div>
 <button class="pri" onclick="addE()">추가</button></section>
 <section class="card"><h2>${S.vm} 지출 내역<small>${list.length}건 · ${yen(sum)}</small></h2>${list.length?list.map(e=>`<div class="it"><div class="m"><b>${esc(e.shop||e.cat)}</b><span>${e.date.slice(5)} · ${esc(e.cat)} <span class="tag">${S.reg.includes(e.cat)?'정기':'비정기'}</span>${e.note?' · '+esc(e.note):''}</span></div><b>${yen(e.amt)}</b><button class="x" aria-label="삭제" onclick="delE(${e.id})">✕</button></div>`).join(''):'<div class="empty">이 달의 지출이 아직 없어요. 위에서 첫 지출을 추가하세요.</div>'}</section>`}
function addE(){const date=$('#fd').value,amt=+$('#fa').value;
 if(!date)return flash('날짜를 입력하세요');if(!(amt>0))return flash('금액을 입력하세요');
 snap();S.entries.push({id:Date.now(),date,cat:$('#fc').value,shop:$('#fs').value.trim(),amt,note:$('#fn').value.trim()});S.ld=date;S.vm=mk(date);save();render();flash('추가했어요')}
function delE(id){snap();S.entries=S.entries.filter(e=>e.id!==id);save();render()}
function vDb(){
 const m=S.vm,t=tot(m),p=tot(addM(m,-1)),d=t.all-p.all,y=+m.slice(0,4);
